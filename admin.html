<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDBF Admin</title>
<link rel="manifest" href="manifests/admin.webmanifest">
<meta name="theme-color" content="#151a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin">
<link rel="icon" href="icons/admin-192.png">
<link rel="apple-touch-icon" href="icons/admin-192.png">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<main id="app-container"></main>
<script type="module">
  import { mount } from './modules/admin/admin.js';
  mount(document.getElementById('app-container'));
  const pinInput = document.getElementById('pin'); // Cambia 'pin' si tu ID es otro

if (pinInput) {
  // Al hacer clic en el input o en su contenedor, forzamos el foco
  pinInput.addEventListener('click', () => {
    pinInput.focus();
  });
}
</script>
</body>
</html>
